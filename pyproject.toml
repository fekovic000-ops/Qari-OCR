[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qari-reader"
version = "0.1.0"
description = "Arabic OCR for scanned PDFs and images, built on the open-source Qari-OCR model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "torch>=2.2",
  "transformers>=4.45,<5",
  "accelerate>=0.26",
  "qwen-vl-utils>=0.0.8",
  "pymupdf>=1.24",
  "pillow>=10",
  "numpy>=1.24",
  "python-docx>=1.1",
]

[project.optional-dependencies]
web = ["gradio>=4.40,<6"]
gpu-lowmem = ["bitsandbytes>=0.43"]
dev = ["pytest>=8"]

[project.scripts]
qari-reader = "qari_reader.cli:main"
qari-reader-web = "qari_reader.app:main"

[tool.setuptools]
packages = ["qari_reader"]
